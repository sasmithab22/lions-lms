<!DOCTYPE html>

<html lang="en"><head><meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
  
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Certificate</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background: #f4f1ea;
      font-family: 'Georgia', serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .certificate {
      width: 1000px;
      height: 700px;
      background: white;
      border: 16px solid #b58b3a;
      padding: 50px;
      box-sizing: border-box;
      position: relative;
      box-shadow: 0 10px 25px rgba(0,0,0,0.15);
    }

    .inner-border {
      border: 4px solid #d4b26a;
      height: 100%;
      padding: 40px;
      box-sizing: border-box;
      text-align: center;
      position: relative;
    }

    h1 {
      font-size: 54px;
      color: #8a5c12;
      margin-bottom: 10px;
      letter-spacing: 2px;
    }

    .subtitle {
      font-size: 24px;
      margin-bottom: 35px;
      color: #555;
    }

    .presented {
      font-size: 24px;
      margin-top: 20px;
      color: #444;
    }

    .student-name {
      font-size: 50px;
      font-weight: bold;
      color: #1f3a5f;
      margin: 20px 0;
      border-bottom: 2px solid #999;
      display: inline-block;
      padding: 8px 30px;
    }

    .details {
      font-size: 24px;
      line-height: 1.8;
      color: #333;
      margin-top: 20px;
    }

    .footer {
      position: absolute;
      bottom: 40px;
      left: 60px;
      right: 60px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .signature {
      text-align: center;
      width: 250px;
    }

    .signature-line {
      border-top: 2px solid #444;
      margin-bottom: 8px;
      padding-top: 8px;
      font-size: 18px;
    }

    .seal {
      position: absolute;
      right: 70px;
      top: 60px;
      width: 120px;
      height: 120px;
      border-radius: 50%;
      border: 6px solid #c89c3d;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      color: #8a5c12;
      font-weight: bold;
      font-size: 18px;
      transform: rotate(-15deg);
      background: rgba(255, 248, 220, 0.8);
    }
  </style>
</head>
<body>
  <div class="certificate">
    <div class="inner-border">
      <div class="seal">EXCELLENCE<br>AWARD</div>

      <h1>CERTIFICATE OF ACHIEVEMENT</h1>
      <div class="subtitle">Hindi Assignment Excellence</div>

      <div class="presented">This certificate is proudly presented to</div>

      <div class="student-name">Geetha</div>

      <div class="details">
        Class: <strong>5</strong><br>
        In recognition of outstanding effort and achievement in the <strong>Hindi Assignment</strong>.
      </div>

      <div class="footer">
        <div class="signature">
          <div class="signature-line">Principal</div>
          The Lions Vision Academy
        </div>

        <div class="signature">
          <div class="signature-line">Date</div>
          6 June 2027
        </div>
      </div>
    </div>
  </div>


</body></html>
